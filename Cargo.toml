[package]
name = "gunsnprices"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
description = "Parse firearm and ammunition product titles: brand, model, caliber, magazine capacity, barrel length, rounds per box, cost per round."
license = "MIT AND CC-BY-4.0"
authors = ["GunsNPrices <app@gunsnprices.com>"]
homepage = "https://gunsnprices.com"
repository = "https://github.com/gunsnprices/gunsnprices-rust"
documentation = "https://docs.rs/gunsnprices"
readme = "README.md"
keywords = ["firearms", "guns", "ammo", "caliber", "ecommerce"]
categories = ["text-processing", "parser-implementations", "command-line-utilities"]
include = [
    "/src/**/*.rs",
    "/data/*.json",
    "/tests/*.rs",
    "/tests/golden.jsonl",
    "/examples/*.rs",
    "/tools/gen_tables.py",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-DATA",
]

[features]
default = []
## `Serialize` for the result types (same JSON field names as the Python and JavaScript packages).
serde = ["dep:serde"]
## The `gunsnprices` command line tool.
cli = ["serde", "dep:serde_json"]

[dependencies]
regex = "1.10"
fancy-regex = "0.20"
serde = { version = "1.0.103", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
serde_json = "1.0"

[[bin]]
name = "gunsnprices"
path = "src/bin/gunsnprices.rs"
required-features = ["cli"]


[package.metadata.docs.rs]
all-features = true
